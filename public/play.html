<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Play — Playables</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="play.js" defer></script>
</head>
<body class="play-page">
  <header class="play-header">
    <a class="back-link" href="./" aria-label="Back to games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg><span>All games</span></a>
    <div class="play-name"><strong id="title">Loading game…</strong><span id="game-name"></span></div>
    <div class="play-actions"><button id="fullscreen">Full screen <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div>
  </header>
  <iframe id="game" class="game-frame" title="Playable game" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
  <div id="error" class="play-error" hidden></div>
</body>
</html>
